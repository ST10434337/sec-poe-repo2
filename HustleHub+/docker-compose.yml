services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: hustlehub-api
    restart: unless-stopped
    env_file:
      - ./api/.env
      - ./docker.env
    environment:
      NODE_ENV: production
      PORT: 4000
      USE_HTTPS: "false"
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  client:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: hustlehub-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api