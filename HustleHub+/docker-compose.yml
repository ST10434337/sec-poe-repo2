services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: hustlehub-api
    restart: unless-stopped
    env_file:
      - ./api/.env
      - ./docker.env
    environment:
      NODE_ENV: production
      PORT: 4000
      USE_HTTPS: "false"
      CLIENT_ORIGIN: http://localhost:3000
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy

  client:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: hustlehub-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  redis:
    image: redis:latest
    container_name: redis_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10   