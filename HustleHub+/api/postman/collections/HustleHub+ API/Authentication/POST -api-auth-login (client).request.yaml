$kind: http-request
name: POST /api/auth/login (client)
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{client_email}}",
      "password": "{{client_password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('logs in and saves the JWT for ', function () {
        pm.response.to.have.status(200);
        pm.expect(body.token).to.be.a('string').and.not.empty;
        pm.expect(body.user.role).to.eql('client');
        pm.environment.set('client_token', body.token);
        pm.environment.set('auth_token', body.token);
        pm.environment.set('client_user_id', body.user.id);
      });
    language: text/javascript
order: 4000
