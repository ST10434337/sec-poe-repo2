$kind: http-request
name: POST /api/auth/register (freelancer)
url: "{{base_url}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{freelancer_email}}",
      "name": "{{freelancer_name}}",
      "password": "{{freelancer_password}}",
      "role": "freelancer"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('registers a freelancer and returns a JWT', function () {
        pm.response.to.have.status(201);
        pm.expect(body.token).to.be.a('string').and.not.empty;
        pm.expect(body.user.role).to.eql('freelancer');
        pm.expect(body.user).not.to.have.property('password');
        pm.environment.set('freelancer_token', body.token);
        pm.environment.set('freelancer_user_id', body.user.id);
      });
    language: text/javascript
order: 3000
