$kind: http-request
name: POST /api/auth/login (freelancer)
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{freelancer_email}}",
      "password": "{{freelancer_password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.test('logs in a freelancer and saves the JWT', function () {
        pm.response.to.have.status(200);
        pm.expect(body.token).to.be.a('string').and.not.empty;
        pm.expect(body.user.role).to.eql('freelancer');
        pm.environment.set('freelancer_token', body.token);
        pm.environment.set('freelancer_user_id', body.user.id);
      });
    language: text/javascript
order: 5000
