$kind: collection
description: Smoke and workflow tests for every registered HustleHub+ API endpoint. Register fresh client and freelancer accounts before running the collection. Configure admin credentials for an existing admin account.
scripts:
  - type: http:afterResponse
    code: |-
      pm.test('Response is JSON', function () {
        pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json');
      });
    language: text/javascript
auth:
  - id: 6e0174a4-9685-4730-94a5-55c003764d9a
    type: bearer
    name: bearer auth
    credentials:
      token: "{{auth_token}}"
