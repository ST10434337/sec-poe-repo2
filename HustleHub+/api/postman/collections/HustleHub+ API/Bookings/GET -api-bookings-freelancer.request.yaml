$kind: http-request
name: GET /api/bookings/freelancer
url: "{{base_url}}/api/bookings/freelancer?page=1&limit=10"
method: GET
queryParams:
  page: "1"
  limit: "10"
auth:
  type: bearer
  credentials:
    token: "{{freelancer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('lists bookings for the authenticated freelancer', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.bookings).to.be.an('array');
        pm.expect(body.page).to.eql(1);
      });
    language: text/javascript
order: 4000
