$kind: http-request
name: GET /
url: "{{base_url}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns the welcome message', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().message).to.include('HustleHub+ API');
      });
    language: text/javascript
order: 1000
