$kind: http-request
name: GET /api/gigs
url: "{{base_url}}/api/gigs?page=1&limit=10"
method: GET
queryParams:
  page: "1"
  limit: "10"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('lists active gigs with pagination metadata', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.gigs).to.be.an('array');
        pm.expect(body).to.include.all.keys('page', 'limit', 'total', 'totalPages');
      });
    language: text/javascript
order: 1000
