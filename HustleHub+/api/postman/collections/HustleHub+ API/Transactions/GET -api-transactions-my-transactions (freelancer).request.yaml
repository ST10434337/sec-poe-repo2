$kind: http-request
name: GET /api/transactions/my-transactions (freelancer)
url: "{{base_url}}/api/transactions/my-transactions?page=1&limit=10"
method: GET
queryParams:
  page: "1"
  limit: "10"
auth:
  type: bearer
  credentials:
    token: "{{freelancer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('lists freelancer transactions with pagination metadata', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.transactions).to.be.an('array');
        pm.expect(body.limit).to.eql(10);
      });
    language: text/javascript
order: 2000
