$kind: http-request
name: GET /api/transactions/tax
url: "{{base_url}}/api/transactions/tax"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{freelancer_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns the freelancer tax estimate for this tax year', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.currency).to.eql('ZAR');
        pm.expect(body.taxYear).to.include.all.keys('year', 'label', 'start', 'end', 'tableYear');
        pm.expect(body.taxYear.label).to.match(/^\d{4}\/\d{2}$/);
        pm.expect(body.earned).to.be.a('number');
        pm.expect(body.pending).to.be.a('number');
        pm.expect(body.estimate.tax).to.be.a('number').and.to.be.at.least(0);
        pm.expect(body.estimate.afterTax).to.eql(body.earned - body.estimate.tax);
        pm.expect(body.estimate.effectiveRate).to.be.within(0, 0.45);
        pm.expect(body.estimate.bands).to.be.an('array');
        pm.expect(body.ifPendingPaid.extraTax).to.be.at.least(0);
      });

      pm.test('monthly totals add up to the paid income', function () {
        const body = pm.response.json();
        pm.expect(body.monthly).to.be.an('array').with.length.within(1, 12);
        const total = body.monthly.reduce((sum, row) => sum + row.earned, 0);
        pm.expect(total).to.eql(body.earned);
      });

      pm.test('paid income matches the income totals', function () {
        pm.expect(pm.response.json().earned).to.eql(Number(pm.environment.get('income_earned')));
      });
    language: text/javascript
order: 3100
